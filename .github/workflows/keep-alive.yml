# Free Supabase projects pause after 7 days without database activity.
# This asks the database for the pickup spots once a day so the site never goes to sleep.
name: Keep database awake

on:
  schedule:
    - cron: '17 15 * * *'   # every day at 15:17 UTC (8:17 AM in San Diego)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read pickup spots
        run: |
          curl --fail --silent --show-error \
            "https://dzsevbdilbzslcepxgfx.supabase.co/rest/v1/pickup_locations?select=id&limit=1" \
            -H "apikey: sb_publishable_x8_3CZcf0ZkgNSHyYwUsDQ_9UiemZAC" > /dev/null
          echo "Database is awake."
