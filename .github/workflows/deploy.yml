# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: GitHub repo → Settings → Pages → Source: "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Safe to be public: the database's security rules protect the data.
      VITE_SUPABASE_URL: https://dzsevbdilbzslcepxgfx.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_x8_3CZcf0ZkgNSHyYwUsDQ_9UiemZAC
      VITE_ADMIN_EMAIL_DOMAIN: lbcrides.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
